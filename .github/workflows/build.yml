name: Build unsigned IPA

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    # 纯文档改动不跑构建（tag 推送不受 paths 过滤影响）
    paths-ignore:
      - "README.md"
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Bundle ID（留空使用 project.yml 中的 com.fve.ledger）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      SCHEME: Ledger
      APP_NAME: Ledger
      IPA_NAME: JianZhang-unsigned.ipa
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Parser tests (text samples + Vision on real screenshot)
        continue-on-error: true
        run: |
          swiftc Ledger/OCR/ReceiptParser.swift Ledger/OCR/CaptureTime.swift Tools/ParserCheck/main.swift -o "$RUNNER_TEMP/parsercheck"
          "$RUNNER_TEMP/parsercheck"
          swiftc Ledger/OCR/ReceiptParser.swift Ledger/OCR/TextRecognizer.swift Ledger/Diagnostics/RunLog.swift Tools/VisionCheck/main.swift -o "$RUNNER_TEMP/visioncheck"
          for f in Tests/Fixtures/*.png; do echo "### $f"; "$RUNNER_TEMP/visioncheck" "$f"; done

      - name: Import tests (Alipay GBK/UTF-8 CSV, WeChat CSV/XLSX, rules, recurrence)
        continue-on-error: true
        run: |
          swiftc Ledger/OCR/ReceiptParser.swift Ledger/Import/BillParser.swift Ledger/Import/Inflate.swift \
            Ledger/Import/XLSXReader.swift Ledger/Rules/RuleMatcher.swift Ledger/Recurring/RecurrenceSchedule.swift \
            Tools/ImportCheck/main.swift -o "$RUNNER_TEMP/importcheck"
          "$RUNNER_TEMP/importcheck" Tests/Fixtures/import

      - name: Apple Intelligence merge + prompt tests (mocked model output validation / fallback, prompt size, budget, error text redaction)
        run: |
          swiftc Ledger/OCR/ReceiptParser.swift Ledger/OCR/ModelMerge.swift Ledger/OCR/ModelPrompt.swift Ledger/OCR/AccountResolver.swift Tools/ModelMergeCheck/main.swift -o "$RUNNER_TEMP/modelmerge"
          "$RUNNER_TEMP/modelmerge"

      - name: Hard timeout tests (no double resume, returns at deadline even if work ignores cancel)
        run: |
          swiftc Ledger/OCR/HardTimeout.swift Tools/HardTimeoutCheck/main.swift -o "$RUNNER_TEMP/hardtimeout"
          "$RUNNER_TEMP/hardtimeout"

      - name: Run log tests (sync append, ~1 MB rotation keeps 2, unclean-exit detection, signal handler breadcrumb)
        run: |
          swiftc Ledger/Diagnostics/RunLog.swift Tools/RunLogCheck/main.swift -o "$RUNNER_TEMP/runlogcheck"
          "$RUNNER_TEMP/runlogcheck"

      - name: Balance math tests (credit card repayment, edit/delete reversal, stats rules)
        run: |
          swiftc Ledger/Models/RecordKind.swift Tools/BalanceCheck/main.swift -o "$RUNNER_TEMP/balancecheck"
          "$RUNNER_TEMP/balancecheck"

      - name: Home date range + day card tests (default this month, presets, month stepping, rollover, custom, weekday labels, top categories)
        run: |
          swiftc Ledger/Views/Home/HomeDateRange.swift Ledger/Views/Home/DaySummary.swift Tools/HomeRangeCheck/main.swift -o "$RUNNER_TEMP/homerange"
          "$RUNNER_TEMP/homerange"

      - name: Passcode route tests (real vs decoy unlock)
        run: |
          swiftc Tools/PasscodeRouteCheck/main.swift -o "$RUNNER_TEMP/passcoderoute"
          "$RUNNER_TEMP/passcoderoute"

      - name: Mode defaults isolation tests (real vs decoy UserDefaults suite)
        run: |
          swiftc Tools/ModeDefaultsCheck/main.swift -o "$RUNNER_TEMP/modedefaults"
          "$RUNNER_TEMP/modedefaults"

      - name: Backup crypto tests (AES-GCM round-trip, wrong password, tampering, plain v1/v3)
        run: |
          swiftc Ledger/Backup/BackupCrypto.swift Ledger/Backup/BackupFormat.swift Tools/BackupCryptoCheck/main.swift \
            -o "$RUNNER_TEMP/backupcheck"
          "$RUNNER_TEMP/backupcheck" Tests/Fixtures/backup

      - name: Dedupe tests (grouping, confidence, auto-handle, import one-to-one matching)
        run: |
          swiftc Ledger/OCR/ReceiptParser.swift Ledger/Dedupe/DedupeEngine.swift Tools/DedupeCheck/main.swift -o "$RUNNER_TEMP/dedupecheck"
          "$RUNNER_TEMP/dedupecheck"

      - name: Receipt duplicate-warning tests (all time sources checked, match summary text)
        run: |
          swiftc Ledger/OCR/ReceiptParser.swift Ledger/OCR/CaptureTime.swift Ledger/Dedupe/DuplicateHint.swift Tools/DupFlagCheck/main.swift -o "$RUNNER_TEMP/dupflagcheck"
          "$RUNNER_TEMP/dupflagcheck"
          # 回归保护：识图查重不能再只限于「识别到时间」的笔（2.0 (19)–3.2 的问题）
          if grep -nE "isDuplicate = item\.dateRecognized|where .*dateRecognized" Ledger/Intents/RecognizeReceiptIntent.swift; then
            echo "识图查重又被 dateRecognized 限制了"; exit 1
          fi
          grep -q "duplicateBanner" Ledger/Intents/ReceiptCardView.swift

      - name: Receipt skin large-title guard
        run: |
          # 3.2 小票皮肤下 UIKit 大标题不绘制，顶部空出一块；四个标签页根页面必须用 themedRootTitle（小票皮肤 = 行内标题）
          for f in Ledger/Views/Home/HomeView.swift Ledger/Views/Stats/StatsView.swift Ledger/Views/Assets/AssetsView.swift Ledger/Views/Settings/SettingsView.swift; do
            grep -q "themedRootTitle(" "$f" || { echo "$f 没有用 themedRootTitle"; exit 1; }
          done
          grep -q "AppSkin.current == .receipt ? .inline" Ledger/Theme/ThemeChrome.swift

      - name: Render receipt card preview (synthetic data only)
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/preview"
          swiftc -parse-as-library -target arm64-apple-macos14.0 Ledger/Theme/ReceiptTypeface.swift Ledger/Intents/ReceiptCardView.swift Tools/RenderPreview/RenderPreview.swift -o "$RUNNER_TEMP/renderpreview"
          "$RUNNER_TEMP/renderpreview" "$RUNNER_TEMP/preview"

      - name: Upload preview images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JianZhang-preview
          path: ${{ runner.temp }}/preview
          if-no-files-found: ignore

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          EXTRA=()
          if [ -n "${{ github.event.inputs.bundle_id }}" ]; then
            EXTRA+=("PRODUCT_BUNDLE_IDENTIFIER=${{ github.event.inputs.bundle_id }}")
          fi
          xcodebuild archive \
            -project Ledger.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Ledger.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            JZ_BUILD_COMMIT="${GITHUB_SHA::7}" \
            "${EXTRA[@]}" \
            | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "error:|warning: .*deprecated|BUILD|ARCHIVE" || true
          test -d "$RUNNER_TEMP/Ledger.xcarchive/Products/Applications/$APP_NAME.app" || {
            echo "::error::Archive failed, see log below"; tail -n 200 "$RUNNER_TEMP/xcodebuild.log"; exit 1; }

      - name: Package IPA
        run: |
          cd "$RUNNER_TEMP"
          rm -rf Payload && mkdir Payload
          cp -R "Ledger.xcarchive/Products/Applications/$APP_NAME.app" Payload/
          zip -qry "$GITHUB_WORKSPACE/$IPA_NAME" Payload
          ls -lh "$GITHUB_WORKSPACE/$IPA_NAME"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "Payload/$APP_NAME.app/Info.plist"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: JianZhang-unsigned-ipa
          path: |
            ${{ env.IPA_NAME }}
            Config/Ledger.entitlements
          if-no-files-found: error

      - name: Upload dSYM (symbolicate crash backtraces from 运行日志)
        uses: actions/upload-artifact@v4
        with:
          name: JianZhang-dSYM
          path: ${{ runner.temp }}/Ledger.xcarchive/dSYMs
          if-no-files-found: ignore

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.IPA_NAME }}
            Config/Ledger.entitlements
          generate_release_notes: true
