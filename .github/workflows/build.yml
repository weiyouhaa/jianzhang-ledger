name: Build unsigned IPA

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Bundle ID（留空使用 project.yml 中的 com.fve.ledger）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      SCHEME: Ledger
      APP_NAME: Ledger
      IPA_NAME: JianZhang-unsigned.ipa
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          EXTRA=()
          if [ -n "${{ github.event.inputs.bundle_id }}" ]; then
            EXTRA+=("PRODUCT_BUNDLE_IDENTIFIER=${{ github.event.inputs.bundle_id }}")
          fi
          xcodebuild archive \
            -project Ledger.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Ledger.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            "${EXTRA[@]}" \
            | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "error:|warning: .*deprecated|BUILD|ARCHIVE" || true
          test -d "$RUNNER_TEMP/Ledger.xcarchive/Products/Applications/$APP_NAME.app" || {
            echo "::error::Archive failed, see log below"; tail -n 200 "$RUNNER_TEMP/xcodebuild.log"; exit 1; }

      - name: Package IPA
        run: |
          cd "$RUNNER_TEMP"
          rm -rf Payload && mkdir Payload
          cp -R "Ledger.xcarchive/Products/Applications/$APP_NAME.app" Payload/
          zip -qry "$GITHUB_WORKSPACE/$IPA_NAME" Payload
          ls -lh "$GITHUB_WORKSPACE/$IPA_NAME"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "Payload/$APP_NAME.app/Info.plist"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: JianZhang-unsigned-ipa
          path: ${{ env.IPA_NAME }}
          if-no-files-found: error

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.IPA_NAME }}
          generate_release_notes: true
