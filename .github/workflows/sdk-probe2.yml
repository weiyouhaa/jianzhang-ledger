name: SDK probe2
on: workflow_dispatch
jobs:
  probe:
    runs-on: macos-15
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Grep
        run: |
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          F=$(find -L "$SDK/" -path "*AppIntents.framework*" -name "arm64e-apple-ios.swiftinterface" | head -1)
          for pat in "func continueInForeground" "supportedModes" "canContinueInForeground" "struct IntentModes" "var systemContext" "currentMode" "requestToContinueInForeground" "OpensIntent" "opensIntent" "needsToContinueInForegroundError"; do
            echo "===== $pat"
            grep -n -B2 -A6 "$pat" "$F" | head -50
          done
