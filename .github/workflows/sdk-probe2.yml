name: SDK probe2
on: workflow_dispatch
jobs:
  probe:
    runs-on: macos-15
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Grep
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          find -L "$SDK/System/Library/Frameworks" -path "*AppIntents*" -name "*.swiftinterface" | grep arm64e | tee /tmp/files
          for pat in "func continueInForeground" "supportedModes" "canContinueInForeground" "struct IntentModes" "var systemContext" "currentMode" "func requestToContinueInForeground" "protocol OpensIntent" "opensIntent:" "needsToContinueInForegroundError"; do
            echo "===== $pat"
            while read -r F; do grep -n -B3 -A4 "$pat" "$F" | head -40; done < /tmp/files
          done
