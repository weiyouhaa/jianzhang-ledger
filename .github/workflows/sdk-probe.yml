name: SDK probe (AppIntents API)

# 手动触发：打印 iOS SDK 中 AppIntents 相关 API 的声明，用来确认可用的交互接口
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Grep AppIntents SwiftUI overlay
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          find -L "$SDK/" -maxdepth 6 -iname "*AppIntents*" | head -40
          for F in $(find -L "$SDK/" -ipath "*appintents*" -name "*.swiftinterface" | grep -v "private" ); do
            echo "##### $F"
            grep -n "func requestChoice\|func requestConfirmation\|func requestDisambiguation\|func requestValue\|static func result.*view\|static func result.*content" "$F" \
              | cut -c1-420 | head -60
          done
