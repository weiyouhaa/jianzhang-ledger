name: UI tests (Simulator)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uitests:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen & generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          iphones = []
          for runtime, devs in data.items():
              if "iOS" not in runtime:
                  continue
              ver = tuple(int(x) for x in runtime.split("iOS-")[-1].split("-") if x.isdigit())
              for d in devs:
                  if d["name"].startswith("iPhone"):
                      iphones.append((ver, d["name"], d["udid"]))
          prefs = ["iPhone 16 Pro", "iPhone 17 Pro", "iPhone 16", "iPhone 17"]
          iphones.sort(reverse=True)
          for p in prefs:
              for v, n, u in iphones:
                  if n == p:
                      print(u); sys.exit()
          print(iphones[0][2])
          ')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$UDID"

      - name: Run UI tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Ledger.xcodeproj -scheme Ledger -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build \
            -resultBundlePath "$RUNNER_TEMP/UITests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/uitest.log" | grep -E "error:|Test Case|passed|failed|TEST|XCTAssert|UI-DUMP" || true
          grep -q "TEST SUCCEEDED" "$RUNNER_TEMP/uitest.log" || { tail -n 150 "$RUNNER_TEMP/uitest.log"; exit 1; }

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uitest-results
          path: |
            ${{ runner.temp }}/UITests.xcresult
            ${{ runner.temp }}/uitest.log
          if-no-files-found: warn
